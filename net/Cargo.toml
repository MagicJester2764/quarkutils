[package]
name = "net"
version = "0.1.0"
edition = "2021"

[dependencies]
quark-rt = { path = "../quark-rt" }
# The protocols, unpatched: Ethernet, ARP, IPv4 and IPv6, ICMP, UDP, TCP,
# and the DHCPv4 and DNS clients. What is Quark's is around them.
smoltcp = { version = "0.12", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-udp",
    "socket-icmp",
    "socket-dhcpv4",
    "socket-dns",
    "proto-dns",
    "iface-max-addr-count-8",
    "iface-max-route-count-4",
    "dns-max-server-count-4",
] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
